# P03 checks: CAFM work orders (silver) + quarantine recall + reconciliation.
# Silver status is normalised to Complete/Open. Planted leaks caught here:
# masked WO-...xx ids (pattern), negative labour_hours, unknown buildings.
checks:
  - id: wo_id_not_null
    dataset: work_orders
    dimension: completeness
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: Every silver work order carries an id.
    why_it_matters: The id is the grain for maintenance KPIs (P07).
    engine: gx
    expectation: ExpectColumnValuesToNotBeNull
    kwargs: {column: WO_Number}

  - id: wo_id_unique
    dataset: work_orders
    dimension: uniqueness
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: WO_Number is unique in silver.
    why_it_matters: Duplicate orders inflate reactive counts and spend.
    engine: gx
    expectation: ExpectColumnValuesToBeUnique
    kwargs: {column: WO_Number}

  - id: wo_id_pattern
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: WO_Number matches ^WO-[0-9]+$ (no planted xx masks).
    why_it_matters: Masked ids from misspelt injection have no register entry.
    engine: gx
    expectation: ExpectColumnValuesToMatchRegex
    kwargs: {column: WO_Number, regex: "^WO-[0-9]+$"}

  - id: wo_priority_valid
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: priority is one of P1 to P4.
    why_it_matters: SLA reporting (P07) depends on clean priorities.
    engine: gx
    expectation: ExpectColumnValuesToBeInSet
    kwargs: {column: priority, value_set: [P1, P2, P3, P4]}

  - id: wo_type_valid
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: wo_type is one of PPM, Reactive, Statutory, Project.
    why_it_matters: Planned versus reactive split is a headline P07 KPI.
    engine: gx
    expectation: ExpectColumnValuesToBeInSet
    kwargs: {column: wo_type, value_set: [PPM, Reactive, Statutory, Project]}

  - id: wo_status_valid
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: status is normalised to Complete or Open by the silver layer.
    why_it_matters: Unknown statuses hide open jobs from the backlog.
    engine: gx
    expectation: ExpectColumnValuesToBeInSet
    kwargs: {column: status, value_set: [Complete, Open]}

  - id: wo_raised_not_null
    dataset: work_orders
    dimension: completeness
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: raised_ts is present (parseable by the P01 date candidates).
    why_it_matters: Agedness and response-time maths need a raised date.
    engine: gx
    expectation: ExpectColumnValuesToNotBeNull
    kwargs: {column: raised_ts}

  - id: wo_cost_non_negative
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: cost_gbp is zero or positive.
    why_it_matters: Negative costs corrupt maintenance spend totals.
    engine: gx
    expectation: ExpectColumnValuesToBeBetween
    kwargs: {column: cost_gbp, min_value: 0}

  - id: wo_labour_non_negative
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: labour_hours is zero or positive (planted negatives leak here).
    why_it_matters: Negative hours corrupt productivity and cost analysis.
    engine: gx
    expectation: ExpectColumnValuesToBeBetween
    kwargs: {column: labour_hours, min_value: 0}

  - id: wo_building_known
    dataset: work_orders
    dimension: referential_integrity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: building_id exists in the building master.
    why_it_matters: Orphan buildings (for example planted B999) break every building report.
    engine: gx
    expectation: ExpectColumnValuesToBeInSet
    kwargs:
      column: building_id
      value_set_from: {truth_table: buildings, column: building_id}

  - id: wo_chronology
    dataset: work_orders
    dimension: consistency
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: completed_ts is null (open) or on or after raised_ts.
    why_it_matters: Completion before raising is impossible and flags source errors.
    engine: sql
    sql_checked: SELECT COUNT(*) FROM silver_work_orders WHERE completed_ts IS NOT NULL
    sql_failed: SELECT WO_Number, AssetRef, raised_ts, completed_ts FROM silver_work_orders WHERE completed_ts IS NOT NULL AND completed_ts < raised_ts

  - id: wo_ppm_has_asset
    dataset: work_orders
    dimension: consistency
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: PPM jobs reference an asset.
    why_it_matters: Asset-less PPM cannot feed asset health (P07).
    engine: sql
    sql_checked: SELECT COUNT(*) FROM silver_work_orders WHERE wo_type = 'PPM'
    sql_failed: SELECT WO_Number, AssetRef, wo_type FROM silver_work_orders WHERE wo_type = 'PPM' AND AssetRef IS NULL

  - id: wo_no_future_raised
    dataset: work_orders
    dimension: validity
    severity: error
    threshold: 100.0
    owner: estates-analytics
    description: raised_ts is not beyond the synthetic window end.
    why_it_matters: Future raised dates are planted defects or source errors.
    engine: sql
    sql_checked: SELECT COUNT(*) FROM silver_work_orders WHERE raised_ts IS NOT NULL
    sql_failed: SELECT WO_Number, raised_ts FROM silver_work_orders WHERE raised_ts IS NOT NULL AND CAST(raised_ts AS DATE) > DATE '{window_end}'

  - id: wo_open_aged
    dataset: work_orders
    dimension: timeliness
    severity: warn
    threshold: 95.0
    owner: estates-analytics
    description: At most 5 percent of open jobs were raised over 90 days before window end.
    why_it_matters: Stale open jobs indicate backlog neglect.
    engine: sql
    building_col: building_id
    by_building: true
    sql_checked: SELECT COUNT(*) FROM silver_work_orders WHERE completed_ts IS NULL
    sql_checked_by_building: SELECT building_id, COUNT(*) FROM silver_work_orders WHERE completed_ts IS NULL GROUP BY 1
    sql_failed: SELECT WO_Number, building_id, raised_ts FROM silver_work_orders WHERE completed_ts IS NULL AND CAST(raised_ts AS DATE) < DATE '{window_end}' - INTERVAL 90 DAY

  - id: wo_reconciled
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Silver plus quarantine row counts reconcile to bronze input.
    why_it_matters: Unexplained row loss between layers hides data.
    engine: sql
    failed_is_scalar: true
    sql_checked: SELECT COUNT(*) FROM read_parquet('{lake}/bronze/cafm_workorders/*/*.parquet')
    sql_failed: SELECT ABS((SELECT COUNT(*) FROM read_parquet('{lake}/bronze/cafm_workorders/*/*.parquet')) - (SELECT COUNT(*) FROM silver_work_orders) - (SELECT COUNT(*) FROM quarantine_work_orders))

  - id: wo_quarantine_explained_rate
    dataset: work_orders
    dimension: reconciliation
    severity: warn
    threshold: 90.0
    owner: data-platform
    description: "At least 90 percent of quarantined rows match a planted defect key."
    why_it_matters: Unexplained quarantine at scale signals a pipeline parsing gap, not data faults.
    engine: sql
    sql_checked: SELECT COUNT(*) FROM quarantine_work_orders
    sql_failed: SELECT WO_Number AS wo_number, _reject_reason FROM quarantine_work_orders WHERE WO_Number NOT IN (SELECT row_key FROM defects WHERE defects.table = 'cafm_workorders')

  - id: wo_recall_nulls
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted nulls_in_mandatory work-order defect is quarantined.
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: nulls_in_mandatory}

  - id: wo_recall_duplicates
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted duplicate work order is quarantined.
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: duplicate_rows}

  - id: wo_recall_out_of_range
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted out-of-range work-order defect is detected (quarantine or silver labour check).
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: out_of_range}

  - id: wo_recall_misspelt_category
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted misspelt-category work-order defect is detected (silver pattern or quarantine).
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: misspelt_category}

  - id: wo_recall_future_dates
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted future-date work order is quarantined.
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: future_dates}

  - id: wo_recall_orphan_fk
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted orphan-FK work order (B999 building) is quarantined.
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: orphan_fk}

  - id: wo_recall_completed_before_raised
    dataset: work_orders
    dimension: reconciliation
    severity: error
    threshold: 100.0
    owner: data-platform
    description: Every planted completed-before-raised defect is detected (quarantine or silver chronology check).
    why_it_matters: Recall evidence for the defect log.
    engine: recall
    kwargs: {table: cafm_workorders, defect_type: completed_before_raised}
