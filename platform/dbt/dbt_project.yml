name: estates
version: 1.0.0
config-version: 2
profile: estates

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

seeds:
  +schema: seeds
  +quote_columns: false

models:
  estates:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +persist_docs:
        relation: true
        columns: true

snapshots:
  +target_schema: snapshots

vars:
  carbon_base_year: 2024
  carbon_target_year: 2040
  meter_lookback_days: 7
