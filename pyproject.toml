[project]
name = "estates-data-portfolio"
version = "0.1.0"
description = "Synthetic University Estates data portfolio (foundation: campus_synth)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "faker>=25",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "duckdb>=1.0",
  "rapidfuzz>=3.0",
  # P11: pinned per docs/PLAN_P11.md (API verified empirically)
  "ifcopenshell==0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  # P04/P05 pins (verified 2026-10-04; keep in sync with docs/PLAN_P05.md)
  "dbt-duckdb==1.10.1",
  "sqlfluff==4.4.0",
  "mkdocs-material>=9.5",
  # P20: readability gate. Pinned to 0.7.3 on purpose: 0.7.7+ pulls NLTK and
  # needs a downloadable cmudict corpus at runtime, which breaks offline CI.
  # 0.7.3 counts syllables with pyphen and needs no corpus.
  "textstat==0.7.13",
  "pip-audit>=2.7",
]

[project.scripts]
campus-synth = "campus_synth.cli:app"
lakehouse-ingest = "ingest.cli:app"
dq = "quality.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["packages/campus_synth/src/campus_synth"]
force-include = { "packages/campus_synth/src/campus_synth" = "campus_synth" }

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "campus_synth.*"
strict = true
[[tool.mypy.overrides]]
module = "ingest.*"
strict = true
[[tool.mypy.overrides]]
module = "quality.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/campus_synth/tests", "platform/tests"]
pythonpath = ["packages/campus_synth/src", "platform/src"]
addopts = "--cov=campus_synth --cov=ingest --cov=quality --cov-report=term-missing"

[tool.coverage.run]
source = ["packages/campus_synth/src", "platform/src"]

[tool.typer]
pretty_exceptions_enable = false
