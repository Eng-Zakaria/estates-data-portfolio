[project]
name = "estates-data-portfolio"
version = "0.1.0"
description = "Synthetic University Estates data portfolio (foundation: campus_synth)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "faker>=25",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
campus-synth = "campus_synth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["packages/campus_synth/src/campus_synth"]
force-include = { "packages/campus_synth/src/campus_synth" = "campus_synth" }

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "campus_synth.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/campus_synth/tests"]
pythonpath = ["packages/campus_synth/src"]
addopts = "--cov=campus_synth --cov-report=term-missing"

[tool.coverage.run]
source = ["packages/campus_synth/src"]

[tool.typer]
pretty_exceptions_enable = false
