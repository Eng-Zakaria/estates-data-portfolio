# P05 pre-commit: mirrors the CI gate locally. Install with:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=25000"]
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-shared-packages
        name: mypy (shared packages)
        entry: mypy packages/campus_synth/src/campus_synth platform/src/ingest
        language: system
        types: [python]
        pass_filenames: false
