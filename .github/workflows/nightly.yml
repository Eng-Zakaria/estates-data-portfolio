name: nightly

# P05 full-volume run: default profile data -> ingest -> dbt build, upload
# reports as artefacts, open an issue if anything fails.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  full-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install package (dev extras, pinned)
        run: uv pip install --system -e ".[dev]" || pip install -e ".[dev]"
      - name: Full-profile data + ingest + dbt
        id: pipeline
        run: |
          python -m campus_synth.cli generate --profile default --seed 42 --out data/raw --defects 0.03
          python -m ingest.cli run-all --raw data/raw --out data/lakehouse --truth data/truth
          python -m ingest.cli reconcile --raw data/raw --out data/lakehouse
          dbt build --profiles-dir platform/dbt --project-dir platform/dbt --target dev
          dbt docs generate --profiles-dir platform/dbt --project-dir platform/dbt --target dev
      - name: Upload dbt docs + warehouse manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dbt-docs
          path: |
            platform/dbt/target/manifest.json
            platform/dbt/target/catalog.json
          if-no-files-found: warn
      - name: Open issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "Nightly full-profile run failed (${{ github.run_id }})" \
            --body "See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            --label "nightly-failure"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
