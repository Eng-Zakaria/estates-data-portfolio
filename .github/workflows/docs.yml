name: docs

# Publishes two things to GitHub Pages:
#   /            -> the interactive demo site (docs/apps, built from the gold marts)
#   /docs/       -> the MkDocs portfolio documentation
#   /dbt-docs/   -> the dbt manifest and catalog
#
# Requires the human to enable Pages (Settings > Pages > GitHub Actions) once.
# See docs/branch-protection.md.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/**"
      - "platform/dbt/**"
      - "projects/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The root Makefile exports this so `python -m ingest.cli` resolves; the
  # workflow needs the same because the packages are src-layout, not installed.
  PYTHONPATH: packages/campus_synth/src:platform/src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install duckdb pyarrow pandas pyyaml openpyxl

      - name: Generate small-profile data
        run: python -m campus_synth.cli generate --profile small --seed 42 --out data/raw --defects 0.03

      - name: Ingest to the lakehouse
        run: |
          python -m ingest.cli run-all --raw data/raw --out data/lakehouse --truth data/truth
          python -m ingest.cli reconcile --raw data/raw --out data/lakehouse

      - name: Build dbt marts
        run: dbt build --profiles-dir platform/dbt --project-dir platform/dbt --target dev --no-version-check

      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir platform/dbt --project-dir platform/dbt --target dev --no-version-check

      - name: Build interactive demo pages
        run: python scripts/build_demos.py

      - name: Build MkDocs site
        run: |
          python -m pip install mkdocs-material mkdocs-mermaid-plugin
          mkdocs build --strict --site-dir site/docs

      - name: Assemble the Pages artifact
        run: |
          set -euo pipefail
          # The demo pages are the site root; MkDocs and dbt docs live under /docs/.
          test -f docs/apps/index.html || { echo "docs/apps missing"; exit 1; }
          mkdir -p site
          cp -r docs/apps/. site/
          test -f site/index.html || { echo "index.html missing"; exit 1; }
          mkdir -p site/docs/dbt-docs
          cp platform/dbt/target/manifest.json platform/dbt/target/catalog.json \
             site/docs/dbt-docs/ 2>/dev/null || echo "(dbt docs unavailable, continuing)"
          echo "--- artifact root ---"
          ls site | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4