name: docs

# P05 docs publish: MkDocs site (+ dbt docs when the project exists) to
# GitHub Pages. Requires the human to enable Pages (see
# docs/branch-protection.md). GX Data Docs hook lives here once P03 lands.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "platform/dbt/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install package (dev extras, pinned)
        run: uv pip install --system -e ".[dev]" || pip install -e ".[dev]"
      - name: Build small-profile data (docs use measured numbers)
        run: python -m campus_synth.cli generate --profile small --seed 42 --out data/raw --defects 0.03
      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir platform/dbt --project-dir platform/dbt --target dev --no-version-check
      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir docs/site
      - name: Copy dbt docs into site
        run: |
          mkdir -p docs/site/dbt-docs
          cp platform/dbt/target/manifest.json platform/dbt/target/catalog.json docs/site/dbt-docs/ || true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
