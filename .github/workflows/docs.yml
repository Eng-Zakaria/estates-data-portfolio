name: docs

# Publishes two things to GitHub Pages:
#   /            -> the interactive demo site (docs/apps, built from the gold marts)
#   /docs/       -> the MkDocs portfolio documentation
#   /dbt-docs/   -> the dbt manifest and catalog
#
# Requires the human to enable Pages (Settings > Pages > GitHub Actions) once.
# See docs/branch-protection.md.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/**"
      - "platform/dbt/**"
      - "projects/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The root Makefile exports this so `python -m ingest.cli` resolves; the
  # workflow needs the same because the packages are src-layout, not installed.
  PYTHONPATH: packages/campus_synth/src:platform/src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # P03 needs Great Expectations; P17 needs pydantic-settings and
          # scikit-learn. Installing them here keeps those demo pages populated.
          pip install duckdb pyarrow pandas pyyaml openpyxl pydantic-settings scikit-learn scipy
          pip install "great-expectations==1.23.2"
          # P11 extracts IFC with IfcOpenShell (pinned; see DATA.md).
          pip install "ifcopenshell==0.9.0"

      - name: Generate small-profile data
        run: python -m campus_synth.cli generate --profile small --seed 42 --out data/raw --defects 0.03

      - name: Ingest to the lakehouse
        run: |
          python -m ingest.cli run-all --raw data/raw --out data/lakehouse --truth data/truth
          python -m ingest.cli reconcile --raw data/raw --out data/lakehouse

      - name: Build dbt marts
        run: dbt build --profiles-dir platform/dbt --project-dir platform/dbt --target dev --no-version-check

      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir platform/dbt --project-dir platform/dbt --target dev --no-version-check

      - name: Run the data-quality framework (populates the P03 demo page)
        continue-on-error: true
        run: |
          python -m quality.cli run || echo "(DQ run failed; P03 page will show a notice)"

      # These project pipelines are fast, deterministic and pure-Python, so the
      # demo pages for P10, P12, P14 and P18 publish real numbers. Each is
      # continue-on-error: a page that cannot be built degrades to a notice
      # naming the command that produces it, rather than failing the deploy.
      - name: P10 institutional return artefacts
        continue-on-error: true
        run: python projects/p10-institutional-return/src/main.py --return-date 2026-03-31 --out data/p10_output

      - name: P12 COBie sample workbooks
        continue-on-error: true
        run: |
          python projects/p12-cobie-validator/src/make_sample_cobie.py
          python projects/p12-cobie-validator/src/cli.py validate data/cobie/valid.xlsx --out data/cobie/report_valid || true

      - name: P14 ISO 19650 sample project and check
        continue-on-error: true
        run: |
          python projects/p14-iso19650-checker/src/make_sample.py --out data/iso19650/sample --n 120 --seed 42
          python projects/p14-iso19650-checker/src/cli.py check data/iso19650/sample \
            --config projects/p14-iso19650-checker/conventions/uk_national_annex.yml \
            --out data/iso19650/report || true

      - name: P18 digital twin crosswalk, relationships, Brick and coverage
        continue-on-error: true
        run: |
          python projects/p18-digital-twin-layer/src/crosswalk.py
          python projects/p18-digital-twin-layer/src/relationships.py
          python projects/p18-digital-twin-layer/src/brick.py
          python projects/p18-digital-twin-layer/src/coverage.py

      - name: P17 air quality and occupancy outputs
        continue-on-error: true
        run: |
          cd projects/p17-air-quality-occupancy
          python -m src.cli all --truth-dir ../../data/truth --output-dir ../../data/p17_output \
            || echo "(P17 page will show a notice)"

      - name: P11 synthetic IFC model, extraction and reconciliation
        continue-on-error: true
        env:
          PYTHONPATH: projects/p11-ifc-analytics/src:packages/campus_synth/src:platform/src
        run: |
          python projects/p11-ifc-analytics/src/ifc2tables/make_sample_ifc.py --out data/ifc/sample.ifc
          python -m ifc2tables.cli extract data/ifc/sample.ifc --out data/gold/ifc
          python -m ifc2tables.cli recon --tables data/gold/ifc --out data/gold/ifc || true

      # P15 needs the MQTT/Node-RED/TimescaleDB compose stack, so the deployed page
      # shows the committed fault-detection evidence rather than live readings.
      - name: Build interactive demo pages
        run: python scripts/build_demos.py

      - name: Build MkDocs site
        run: |
          python -m pip install mkdocs-material mkdocs-mermaid-plugin
          mkdocs build --strict --site-dir site/docs

      - name: Assemble the Pages artifact
        run: |
          set -euo pipefail
          # The demo pages are the site root; MkDocs and dbt docs live under /docs/.
          test -f docs/apps/index.html || { echo "docs/apps missing"; exit 1; }
          mkdir -p site
          cp -r docs/apps/. site/
          test -f site/index.html || { echo "index.html missing"; exit 1; }
          mkdir -p site/docs/dbt-docs
          cp platform/dbt/target/manifest.json platform/dbt/target/catalog.json \
             site/docs/dbt-docs/ 2>/dev/null || echo "(dbt docs unavailable, continuing)"
          echo "--- artifact root ---"
          ls site | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4