[project]
name = "p17-air-quality-occupancy"
version = "0.1.0"
description = "Smart Campus air quality and occupancy analytics (synthetic)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]