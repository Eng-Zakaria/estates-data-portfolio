# Mosquitto configuration for the P15 stack.
#
# Two listeners:
#
#   1883 (host-facing, port-mapped)   password protected, credentials in
#                                    mosquitto_passwd (DEMO ONLY)
#   2883 (compose network only)       no auth
#
# Why the internal listener is unauthenticated: Node-RED's core mqtt-broker
# node takes its credentials from Node-RED's encrypted credential store, which
# cannot be committed to a repository, so a headless demo stack cannot supply
# them from the flow file. The internal listener is only reachable from other
# containers on the p15-bms-iot network.
#
# For a real deployment: keep ONE listener, require auth, and terminate TLS
# (see docs/mapping-to-real-systems.md and docs/security.md). Do not ship this
# split-listener arrangement.
#
# Verified on eclipse-mosquitto:2.1.2: with per_listener_settings enabled,
# each listener's options must follow its `listener` line, and
# allow_anonymous/password_file are listener-scoped.

per_listener_settings true

# --- host-facing listener -------------------------------------------------
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd

# --- compose-network listener (Node-RED) ----------------------------------
listener 2883
protocol mqtt
allow_anonymous true

# --- shared runtime settings ---------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
