apiVersion: 1

# Credentials come from environment variables expanded by Docker Compose
# (see ../.env.example). Defaults are DEMO ONLY.
datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      timescaledb: true
      postgresVersion: 1500
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
