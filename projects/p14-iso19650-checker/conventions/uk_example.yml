# UK BIM Framework / ISO 19650-style naming convention (example)
# VERIFY: field lengths, code lists and separators against official guidance before production use.
# This config is intentionally editable; the checker reads everything from here.

name: uk_example
description: Example UK-style project file naming convention
separator: "-"
extension_allowlist: [".ifc", ".pdf", ".dwg", ".rvt", ".xlsx", ".docx"]
path_max_length: 260

fields:
  - name: project
    position: 0
    length: 6
    charset: "A-Z0-9"
    description: Project code
    required: true

  - name: originator
    position: 1
    length: 6
    charset: "A-Z0-9"
    description: Originator organisation code
    required: true

  - name: volume_system
    position: 2
    length: 2
    charset: "A-Z0-9"
    description: Volume or system code
    required: true

  - name: level_location
    position: 3
    length: 2
    charset: "A-Z0-9"
    description: Level or location code
    required: true

  - name: type
    position: 4
    length: 2
    charset: "A-Z0-9"
    description: Document type code
    required: true

  - name: role
    position: 5
    length: 2
    charset: "A-Z0-9"
    description: Discipline/role code
    required: true

  - name: number
    position: 6
    length: 4
    charset: "0-9"
    description: Sequential number
    required: true

  - name: status
    position: 7
    length: null  # variable: WIP=3, S1/S4/S7=2
    charset: "A-Z0-9"
    allowed_values: ["WIP", "S0", "S1", "S2", "S3", "S4", "S5", "S6", "S7"]
    description: Status/suitability code
    required: true

  - name: revision
    position: 8
    length: 2
    charset: "A-Z0-9"
    description: Revision identifier
    required: true

container_states:
  WIP: ["WIP"]
  Shared: ["S1", "S2", "S3"]
  Published: ["S4", "S5", "S6"]
  Archive: ["S7"]
